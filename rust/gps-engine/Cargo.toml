[package]
name = "gps-engine"
description = "Offline GPS track processing, route matching, and ghost comparison engine for running and cycling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
quick-xml = { version = "0.37", default-features = false, features = ["encoding"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"

[[example]]
name = "analyze"
path = "examples/analyze.rs"